services:
  seq:
    container_name: seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    restart: always
    
  postgres:
    container_name: postgres-directory-service
    image: postgres:16
    environment:
      POSTGRES_DB: directory-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - "5437:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: